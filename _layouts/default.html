---
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <!-- HEADER PREMIUM -->
    <header class="hero">
        <nav class="navbar">
            <div class="nav-left">
                <a href="/" class="site-title">Serge Segbefia</a>
            </div>
            <div class="nav-right">
                <a href="/" class="nav-link">Home</a>
                <a href="/apropos" class="nav-link">À propos</a>
                <a href="/projets" class="nav-link">Projets</a>
                <a href="/contact" class="nav-link">Contact</a>
            </div>
        </nav>

        <div class="hero-content">
            <h1>{{ page.hero_title }}</h1>
            <p>{{ page.hero_subtitle }}</p>
            {% if page.hero_button %}
            <a href="{{ page.hero_button_url }}" class="hero-btn">{{ page.hero_button }}</a>
            {% endif %}
        </div>
    </header>

    <!-- CONTENU DES PAGES -->
    <main class="content">
        {{ content }}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Serge SEGBEFIA — Senior IT Project Manager (PMP®)</p>
    </footer>

    <!-- JS -->
    <script src="/assets/js/main.js"></script>
</body>
</html>
